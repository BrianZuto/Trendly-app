# Perfil "test": lo activa maven-surefire-plugin para todas las pruebas.

# H2 en memoria en modo MySQL. Flyway corre las mismas migraciones que en MySQL.
spring.datasource.url=jdbc:h2:mem:trendly;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Clave solo para pruebas (64 bytes en Base64). No es el secreto real.
jwt.secret=dHJlbmRseS1jbGF2ZS1zb2xvLXBhcmEtcHJ1ZWJhcy1uby11c2FyLWVuLXByb2R1Y2Npb24tMTIzNDU2Nzg5MA==
jwt.expiration-ms=3600000

# Las pruebas no abren Chrome ni salen a internet: los scrapers leen fixtures de src/test/resources/scraping
scraping.selenium-habilitado=false
