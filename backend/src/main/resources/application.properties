spring.application.name=trendly

# Variables de entorno desde el .env de la raíz del repositorio (si existe). Las variables de entorno reales tienen prioridad.
# Funciona tanto ejecutando desde backend/ como desde la raíz.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# --- Base de datos (SCRUM-29) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/trendly?connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME:trendly}
spring.datasource.password=${DB_PASSWORD:}

# El esquema lo maneja Flyway (db/migration). Hibernate solo valida que las entidades coincidan.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- JWT (SCRUM-31) --- El secreto solo vive en la variable de entorno JWT_SECRET.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS: orígenes del frontend, separados por comas (agregar la URL de Vercel en SCRUM-35)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Scraping (SCRUM-40/41) --- User-Agent identificable, timeout de 10 s y 1 petición cada 2 s por marketplace.
# AliExpress arma el precio con JavaScript: hace falta Chrome instalado para el modo headless (Selenium).
scraping.user-agent=${SCRAPING_USER_AGENT:Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36 TrendlyBot/0.1 (+https://github.com/BrianZuto/Trendly-app)}
scraping.timeout-ms=10000
scraping.segundos-entre-peticiones=2
scraping.selenium-habilitado=${SCRAPING_SELENIUM:true}

# --- MercadoLibre (SCRUM-40) --- API oficial: el HTML tiene verificación anti-bots y robots.txt no permite rastreadores.
# Credenciales de la app creada en developers.mercadolibre.com.co. Sin ellas, el scraper devuelve FALLO (BLOQUEO).
mercadolibre.api-url=${ML_API_URL:https://api.mercadolibre.com}
mercadolibre.client-id=${ML_CLIENT_ID:}
mercadolibre.client-secret=${ML_CLIENT_SECRET:}

# --- Job de recolección (SCRUM-39) --- La Azure Function llama POST /api/v1/interno/recoleccion/ejecutar cada 6 h
# con la API key en X-Api-Key. Sin RECOLECCION_API_KEY el endpoint responde 503.
recoleccion.api-key=${RECOLECCION_API_KEY:}
recoleccion.tamano-lote=20
# Desarrollo local: el mismo ciclo con @Scheduled, sin Azure (cada 6 h por defecto)
trendly.scheduler.local=${TRENDLY_SCHEDULER_LOCAL:false}
trendly.scheduler.cron=${TRENDLY_SCHEDULER_CRON:0 0 */6 * * *}

# --- TRM (SCRUM-42) --- Conjunto de datos abierto de la Superintendencia Financiera. Caché de 24 h.
trm.url=${TRM_URL:https://www.datos.gov.co/resource/32sa-8pi3.json}
