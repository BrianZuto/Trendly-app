spring.application.name=trendly

# Lee el .env de la raíz del repositorio (o de backend/) si existe. Las variables de entorno reales tienen prioridad.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# --- Base de datos (SCRUM-29) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/trendly?connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME:trendly}
spring.datasource.password=${DB_PASSWORD:}

# El esquema lo maneja Flyway (db/migration). Hibernate solo valida que las entidades coincidan.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
