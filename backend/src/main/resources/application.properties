spring.application.name=trendly

# Variables de entorno desde el .env de la raíz del repositorio (si existe).
# Funciona tanto ejecutando desde backend/ como desde la raíz.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# JWT (SCRUM-31). El secreto solo vive en la variable de entorno JWT_SECRET.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
