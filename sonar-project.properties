# Análisis de SonarCloud (SCRUM-44). Monorepo: backend (Java) y frontend (React) en un solo proyecto.
# Revisar la clave y la organización en SonarCloud → Administration → Project Information.
sonar.projectKey=BrianZuto_Trendly-app
sonar.organization=brianzuto
sonar.projectName=Trendly
sonar.sourceEncoding=UTF-8

# --- Código y pruebas ---
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
# En el frontend las pruebas viven junto al código, así que se separan por nombre
sonar.exclusions=frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**,frontend/src/assets/**
sonar.test.inclusions=backend/src/test/java/**,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**

# --- Backend: requiere ./mvnw verify antes del análisis ---
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# --- Frontend: requiere npm run coverage antes del análisis ---
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# --- Fuera de la cobertura (solo arrancan la aplicación) ---
sonar.coverage.exclusions=backend/src/main/java/co/trendly/TrendlyApplication.java,frontend/src/main.jsx

# --- El job falla si no se cumple el quality gate (así bloquea el merge) ---
sonar.qualitygate.wait=true
