# Pipeline de integración continua (SCRUM-28).
# Los jobs "backend", "frontend" y "sonarcloud" son los checks obligatorios en main y develop.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

# Si llega un push nuevo al mismo PR, se cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, probar y verificar cobertura (JaCoCo ≥ 70 %)
        run: ./mvnw -B verify

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

      - name: Guardar clases compiladas y reporte XML para SonarCloud
        uses: actions/upload-artifact@v4
        with:
          name: sonar-backend
          path: |
            backend/target/classes/
            backend/target/test-classes/
            backend/target/site/jacoco/jacoco.xml
          retention-days: 1

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas con cobertura (Vitest)
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage/
          if-no-files-found: ignore

  # Azure Function que dispara la recolección cada 6 h (SCRUM-39)
  functions:
    name: functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

  # App móvil con Expo (SCRUM-51)
  mobile:
    name: mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas con cobertura (Jest)
        run: npm run coverage

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-mobile
          path: mobile/coverage/
          if-no-files-found: ignore

  # Análisis de calidad (SCRUM-44). Reutiliza la compilación y la cobertura de los jobs anteriores.
  sonarcloud:
    name: sonarcloud
    needs: [backend, frontend, mobile]
    runs-on: ubuntu-latest
    # Los PR desde forks no tienen acceso al secreto SONAR_TOKEN.
    # Al llegar a main no se analiza: el plan gratuito solo da el quality gate de la rama principal del proyecto en
    # SonarCloud (develop), y ese código ya pasó el análisis en su PR. Si fallara aquí, CD no desplegaría nunca.
    if: github.ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # SonarCloud necesita el historial para detectar el código nuevo

      - name: Descargar compilación y cobertura del backend
        uses: actions/download-artifact@v4
        with:
          name: sonar-backend
          path: backend/target

      - name: Descargar cobertura del frontend
        uses: actions/download-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage

      - name: Descargar cobertura de la app móvil
        uses: actions/download-artifact@v4
        with:
          name: cobertura-mobile
          path: mobile/coverage

      - name: Análisis de SonarCloud y quality gate
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
